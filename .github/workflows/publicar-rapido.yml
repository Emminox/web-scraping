# Publica el sitio SIN volver a descargar las tiendas: usa la base guardada en la Release "datos" (la que dejó
# la última corrida de "Actualizar sitio") y solo regenera las páginas. Tarda 2–3 minutos.
# Se lanza SOLO cuando se sube a main un cambio en el código del sitio (radar/sitio/), o a mano desde Actions.
# No reemplaza a "Actualizar sitio": no lee precios nuevos ni modifica la base.
name: Publicar sitio (rápido)

on:
  push:
    branches: [main]
    paths:
      - "radar/sitio/**"   # Páginas, estilos, app.js y generar.py: lo que cambia cuando se cambia el diseño.
  workflow_dispatch:

permissions:
  contents: read    # Para descargar la base de la Release "datos".
  pages: write      # Para publicar en GitHub Pages.
  id-token: write   # Requerido por actions/deploy-pages.

# MISMO grupo que "Actualizar sitio": si la corrida completa está en curso, esta publicación ESPERA en fila a que
# termine. Así usa la base recién actualizada y su diseño nuevo no queda pisado por la corrida completa, que se
# llevó el código de antes al empezar. (GitHub deja una sola ejecución esperando por grupo: si se suben dos cambios
# seguidos mientras tanto, queda la más nueva, que ya incluye ambos.)
concurrency:
  group: actualizar-sitio
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Descargar la base de la Release "datos"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p datos
          gh release download datos --pattern radar.sqlite --dir datos

      # Solo genera las páginas desde la base (y pide el tipo de cambio: una solicitud).
      - name: Generar el sitio
        run: python -m radar sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
