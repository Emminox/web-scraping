# =============================================================================
# Configuración del Radar de Ofertas Multinúcleo
# =============================================================================
# Este archivo controla CÓMO se ejecuta el pipeline sin tocar el código.
# Las rutas relativas se resuelven desde la raíz del repositorio (la carpeta
# que contiene a config/).
#
# IMPORTANTE: los números de límites (conexiones, intervalos, reintentos) son
# valores PROVISIONALES para poder hacer los spikes de la semana 1. Los
# definitivos se fijan y justifican en el ADR de límites de concurrencia.
# =============================================================================

[ejecucion]
# Modo del pipeline (sección 7 del enunciado):
#   "secuencial"  -> todo en un hilo, un juego y una fuente a la vez (línea base T_sec)
#   "concurrente" -> etapas de E/S con varios workers, el resto secuencial
#   "paralelo"    -> además, el emparejamiento repartido entre núcleos
# (El pipeline se implementa en la semana 2; hoy solo se valida el valor.)
modo = "secuencial"

# De dónde salen los datos:
#   "vivo"   -> se descargan de los sitios reales (y se guardan en el almacén)
#   "replay" -> se leen del almacén de capturas con latencia simulada (mediciones formales)
fuente = "vivo"

# Precios de Steam por lote (ADR-013): los juegos con producto de Steam ya emparejado actualizan su precio con
# /api/appdetails, muchos por solicitud, en vez de una búsqueda por juego (Steam frenaba las búsquedas desde
# GitHub Actions). Los juegos nuevos se siguen buscando por título. Solo en vivo: en replay no cambia nada.
steam_precios_por_lote = true

[pipeline]
# Límites de concurrencia por etapa (sección 7 del enunciado). VALORES PROVISIONALES: los definitivos se
# fijan y justifican en el ADR de límites de concurrencia. Diseño explicado en docs/pipeline.md.
# Solo se usan en los modos "concurrente" y "paralelo"; el modo "secuencial" ignora esta sección.

# Workers (hilos) de las etapas de E/S. Pueden ser más que los núcleos: pasan casi todo el tiempo esperando la red.
workers_descubrir = 4
workers_descargar = 16
# Workers del emparejamiento (solo modo "paralelo"). Con "procesos" cada uno es un proceso aparte (esquiva el
# GIL); con "hilos" comparten el GIL (sirve para la comparación de la pregunta 5 del informe).
workers_emparejar = 4
ejecutor_emparejar = "procesos"

# Tamaño máximo de cada cola entre etapas. Si una cola se llena, la etapa que la alimenta espera
# (contrapresión): así una etapa rápida no acumula memoria sin límite delante de una lenta.
cola_tareas = 64       # Descubrir  -> Descargar
cola_descargas = 64    # Descargar  -> Parsear
cola_resultados = 64   # Parsear    -> Emparejar
cola_persistir = 32    # Emparejar  -> Persistir

[red]
# Identifica al cliente ante los sitios (scraping responsable, sección 10).
# Debe nombrar el proyecto. NO poner correos ni datos personales aquí.
user_agent = "RadarOfertasMultinucleo/0.1 (proyecto academico IC-3101 TEC Costa Rica)"

# Segundos máximos que se espera en cada operación de red antes de abandonar el intento.
timeout_segundos = 15.0

# Reintentos ADEMÁS del primer intento (3 => hasta 4 solicitudes en total).
max_reintentos = 3

# Backoff exponencial con jitter: la espera antes del reintento n es un valor
# aleatorio entre 0 y min(backoff_max, backoff_base * 2^n) segundos.
backoff_base_segundos = 1.0
backoff_max_segundos = 30.0

# Si un sitio responde 429/503 pidiendo esperar (Retry-After) MÁS que el backoff máximo, no se reintenta:
# el dominio queda en pausa todo ese tiempo y sus tareas van a la cola de fallidos. Antes del reintento final
# se espera a que termine la pausa solo si no pasa de este tope; si pasa, ese dominio queda para la próxima corrida.
pausa_maxima_segundos = 1800.0
# Un 429 sin Retry-After pausa el dominio este tiempo (antes se reintentaba a los pocos segundos).
pausa_429_segundos = 900.0

# Límites por dominio que se aplican cuando el dominio no tiene una regla propia abajo.
#   max_conexiones           -> solicitudes simultáneas permitidas al mismo dominio (semáforo)
#   intervalo_minimo_segundos -> separación mínima entre el INICIO de dos solicitudes al mismo
#                                dominio (cortesía; solo en modo vivo)
max_conexiones_por_dominio = 2
intervalo_minimo_segundos = 1.0

# Horas que una respuesta guardada se considera "fresca" en modo vivo. Si es más vieja,
# se vuelve a descargar. 0 = nunca reutilizar (siempre descargar).
ttl_almacen_horas = 12.0

# Reglas específicas por dominio para las fuentes elegidas (ADR-004). Valores conservadores: ninguna
# fuente declara Crawl-delay; se usa como máximo 1 solicitud por segundo y 2 conexiones simultáneas.
# Best Buy y Metacritic devuelven páginas de 0,6 MB: se les da un ritmo más lento.
[red.dominios."www.metacritic.com"]
max_conexiones = 1
intervalo_minimo_segundos = 2.0

[red.dominios."store.steampowered.com"]
# 2026-11-11: desde GitHub Actions (sin caché) respondió 429 tras ~150 búsquedas a 2 conexiones / 1 s.
# Su buscador tolera unas 200 solicitudes cada 5 minutos: 1 cada 1,6 s queda por debajo.
max_conexiones = 1
intervalo_minimo_segundos = 1.6

[red.dominios."catalog.gog.com"]
max_conexiones = 2
intervalo_minimo_segundos = 1.0

[red.dominios."www.nintendo.com"]
max_conexiones = 2
intervalo_minimo_segundos = 1.0

[red.dominios."www.bestbuy.com"]
max_conexiones = 1
intervalo_minimo_segundos = 2.0

[red.dominios."www.cheapshark.com"]
# El 2026-11-11 respondió 429 con Retry-After: 993 tras 67 solicitudes en ~4,5 min (una cada ~4 s).
# No publica un límite: se usa una cada 6 s y, si vuelve a pedir esperar, se pausa el dominio (red.pausa_maxima_segundos).
max_conexiones = 1
intervalo_minimo_segundos = 6.0

[descubrimiento]
# Etapa 0 (ADR-004): listados de Metacritic ordenados por Metascore, 50 juegos por página.
# Plataformas con el nombre que usa Metacritic en sus URLs.
plataformas = ["ps5", "xbox-series-x", "nintendo-switch", "pc"]
# Páginas por plataforma si no tiene un valor propio abajo.
paginas_por_plataforma = 4

# Valores propios (ADR-011): PC y Switch tienen 2 o más tiendas consultables, PS5 y Xbox solo Best Buy, así que
# solo los juegos de PC y Switch pueden publicarse (el sitio exige precio en 2 tiendas). Se recorren más páginas
# de esas plataformas: 12 x 50 + 8 x 50 + 2 x 4 x 50 = 1400 entradas.
[descubrimiento.paginas]
pc = 12
nintendo-switch = 12

[replay]
# Latencia simulada por solicitud en modo replay (sección 11 del enunciado).
# Variante fija: variacion_ms = 0. Variante aleatoria: variacion_ms > 0
# (la latencia se elige uniformemente en [latencia_ms - variacion_ms, latencia_ms + variacion_ms]).
latencia_ms = 200
variacion_ms = 0
# Semilla del generador aleatorio, para que una ejecución en replay sea repetible.
semilla = 42

[rutas]
# Almacén de respuestas descargadas: funciona como caché en modo vivo y como fuente en modo replay.
capturas = "datos/capturas"
# Páginas de ejemplo guardadas durante los spikes; se usan como entradas de prueba de los parsers.
fixtures = "fixtures"
# Carpeta con los archivos JSON del catálogo de juegos (formato en catalogo/README.md).
catalogo = "catalogo"
# Base de datos SQLite (ADR-003). No se sube a Git: se conserva entre ejecuciones según el ADR de
# almacenamiento. En modo replay se usa automáticamente "<nombre>-replay.sqlite", para no mezclar
# precios capturados con el historial real del sitio.
base_datos = "datos/radar.sqlite"
# Carpeta donde se genera el sitio estático (etapa 5). En replay: "<carpeta>-replay".
sitio = "sitio"
# Mediciones de los barridos (CSV) que el panel de métricas convierte en curvas de speedup.
mediciones = "datos/mediciones"
